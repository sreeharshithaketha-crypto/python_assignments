<!DOCTYPE html>
<html>
<head>
    <title>Positive, Negative, Zero</title>
</head>
<body>
    <p>Check whether a number is Positive (+), Negative (-), or Zero (0)</p>
    
    <script>
        let number = parseInt(prompt("Enter a number:"));
        
        if (number > 0) {
            alert(number + " is Positive (+)");
        } else if (number < 0) {
            alert(number + " is Negative (-)");
        } else {
            alert("Number is Zero (0)");
        }
    </script>
</body>
</html>
