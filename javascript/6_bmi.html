<!DOCTYPE html>
<html>
<head>
    <title>BMI Calculator</title>
</head>
<body>
    <p>Calculate BMI and check category: Underweight, Normal, Overweight, Obesity</p>
    
    <script>
        let weight = parseFloat(prompt("Enter weight in kg:"));
        let height = parseFloat(prompt("Enter height in meters:"));
        
        let bmi = weight / (height * height);
        let category = "";
        
        if (bmi < 18.5) {
            category = "Underweight";
        } else if (bmi >= 18.5 && bmi < 25) {
            category = "Normal";
        } else if (bmi >= 25 && bmi < 30) {
            category = "Overweight";
        } else {
            category = "Obesity";
        }
        
        alert("BMI: " + bmi.toFixed(2) + " - " + category);
    </script>
</body>
</html>
