<!DOCTYPE html>
<html>
<head>
    <title>Leap Year</title>
</head>
<body>
    <p>Check whether a year is a leap year or not</p>
    
    <script>
        let year = parseInt(prompt("Enter a year:"));
        
        if (year % 4 === 0) {
            alert(year + " is a Leap Year");
        } else {
            alert(year + " is NOT a Leap Year");
        }
    </script>
</body>
</html>
