<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment Operators</title>
    <script>
        let x = 50;

        console.log(x += 100);
        console.log(x -= 50);
        console.log(x *= 2);
        console.log(x /= 2);
        console.log(x %= 2);
    </script>
</head>
<body>
</body>
</html>
