<!DOCTYPE html>
<html>
<head>
    <title>Password Validation</title>
</head>
<body>
    <p>Enter password "admin123" to login successfully</p>
    
    <script>
        let password = prompt("Enter password:");
        
        if (password === "admin123") {
            alert("Login Successful");
        } else {
            alert("Invalid Login");
        }
    </script>
</body>
</html>
