<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparison Operators</title>
    <script>
        let x = 100;
        let y = 25;

        console.log(x != y);
        console.log(x == y);
        console.log(x < y);
        console.log(x <= y);
        console.log(x > y);
        console.log(x >= y);
        console.log(x != y);
    </script>
</head>
<body>
</body>
</html>
