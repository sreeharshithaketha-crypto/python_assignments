<!DOCTYPE html>
<html>
<head>
    <title>Temperature Check</title>
</head>
<body>
    <p>Check if temperature is too hot or normal</p>
    
    <script>
        let temperature = prompt("Enter temperature in °C:");
        temperature = parseInt(temperature);
        
        if (temperature > 40) {
            alert("Too Hot");
        } else {
            alert("Normal Weather");
        }
    </script>
</body>
</html>
