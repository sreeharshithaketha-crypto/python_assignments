<!DOCTYPE html>
<html>
<head>
    <title>Even or Odd</title>
</head>
<body>
    <p>Check whether a number is Even or Odd</p>
    
    <script>
        let number = parseInt(prompt("Enter a number:"));
        
        if (number % 2 === 0) {
            alert(number + " is Even");
        } else {
            alert(number + " is Odd");
        }
    </script>
</body>
</html>
