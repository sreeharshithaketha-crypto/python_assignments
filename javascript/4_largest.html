<!DOCTYPE html>
<html>
<head>
    <title>Largest of Three Numbers</title>
</head>
<body>
    <p>Find the largest among three numbers</p>
    
    <script>
        let num1 = parseInt(prompt("Enter first number:"));
        let num2 = parseInt(prompt("Enter second number:"));
        let num3 = parseInt(prompt("Enter third number:"));
        
        let largest = num1;
        
        if (num2 > largest) {
            largest = num2;
        }
        if (num3 > largest) {
            largest = num3;
        }
        
        alert("Largest number is: " + largest);
    </script>
</body>
</html>
