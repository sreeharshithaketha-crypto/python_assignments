<!DOCTYPE html>
<html>
<head>
    <title>Divisible by 5</title>
</head>
<body>
    <p>Check if a number is divisible by 5</p>
    <script>
        let number = prompt("Enter a number:");
        
        
        if (number % 5 === 0) {
            alert(number + " is divisible by 5");
        } else {
            alert(number + " is NOT divisible by 5");
        }
    </script>
</body>
</html>
