<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>factorial of N Number</h2>
    <label>enter n value:</label>
    <input type="number" id="n">
    <button onclick="calculatefactorial()">factorial</button>
    <p id="factorial"></p>
    <script>
        function calculatefactorial() {
            let n = parseInt(document.getElementById("n").value);
            let sum =1;

        for (let i = 1; i <= n; i++) 
        {
            sum *= i;
        }

            document.getElementById("factorial").innerHTML = "factorial:" + sum;
        }
    </script>

</body>
</html>
