<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>****Supermarket Billing App****</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <style>
        body{
            background-color:#333a41;
        }

        .card{
            box-shadow:0 4px 10px rgba(173, 153, 153, 0.1);
        }

        #bill{
            min-height:300px;
        }
    </style>
</head>
<body>

<div class="container mt-5">

    <h1 class="text-center mb-4">
        ****SUPER MARKET BILLING APP****
    </h1>

    <div class="row">

        <!-- Input Form -->
        <div class="col-md-6">
            <div class="card p-4">

                <div class="mb-3">
                    <label class="form-label">Product Name</label>
                    <input type="text" class="form-control" id="product">
                </div>

                <div class="mb-3">
                    <label class="form-label">Total Quantity</label>
                    <input type="number" class="form-control" id="qty">
                </div>

                <div class="mb-3">
                    <label class="form-label">Price per Item</label>
                    <input type="number" class="form-control" id="price">
                </div>

                <button class="btn btn-success w-100"
                        onclick="generateBill()">
                    Generate Bill
                </button>

            </div>
        </div>

        <!-- Bill Display -->
        <div class="col-md-6">
            <div class="card p-4">

                <h3 class="text-center mb-3">
                    Bill Receipt
                </h3>

                <div id="bill">
                    <p class="text-muted">
                        Bill details will appear here...
                    </p>
                </div>

            </div>
        </div>

    </div>

</div>

<script>

function generateBill()
{
    let product = document.getElementById("product").value;
    let qty = parseInt(document.getElementById("qty").value);
    let price = parseFloat(document.getElementById("price").value);

    let total = qty * price;
    let gst = total * 0.18;
    let amount = total + gst;

    document.getElementById("bill").innerHTML = `
        <table class="table table-bordered">
            <tr>
                <th colspan="2" class="text-center bg-success text-white">
                    SUPER MARKET BILL
                </th>
            </tr>

            <tr>
                <th>Product</th>
                <td>${product}</td>
            </tr>

            <tr>
                <th>Total Quantity</th>
                <td>${qty}</td>
            </tr>

            <tr>
                <th>Price</th>
                <td>₹${price.toFixed(2)}</td>
            </tr>

            <tr>
                <th>Total</th>
                <td>₹${total.toFixed(2)}</td>
            </tr>

            <tr>
                <th>GST (18%)</th>
                <td>₹${gst.toFixed(2)}</td>
            </tr>

            <tr class="table-success">
                <th>Amount</th>
                <td><strong>₹${amount.toFixed(2)}</strong></td>
            </tr>
        </table>
    `;
}

</script>

</body>
</html>
